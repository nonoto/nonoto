[package]
name = "nonoto-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "nonoto-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.1"
nonoto-core = { path = "../nonoto-core" }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
# テスト用のストアで、`PageStore::update` の引数の日時の型を書くために使う。
jiff = "0.2.43"
tempfile = "3.27.0"

[lints]
workspace = true
