# リポジトリのどのディレクトリでcargoを実行しても読まれる (子のディレクトリの設定と合わせて読まれる)。

[env]
# Nonotoが対応するiOSの最低の版。rustcのリンクと、Cのコードをコンパイルするclang (cc・OpenSSLのビルド) の
# 両方がこの変数を読むため、ここで揃える。揃えないと、Rustの既定 (10.0) でリンクする一方、
# 同梱のSQLCipherとOpenSSLはSDKの版向けにコンパイルされ、iOS 13から入ったシンボルを解決できずにリンクが失敗する。
IPHONEOS_DEPLOYMENT_TARGET = "17.0"

[registry]
# 公開から3日経っていない版を、依存を足すときと上げるときに選ばない。
# 悪意のある版の多くは公開から数時間から数日で見つかるため、そのあいだは取り込まない。
global-min-publish-age = "3 days"
