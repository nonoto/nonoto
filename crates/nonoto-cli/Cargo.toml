[package]
name = "nonoto-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "nonoto"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
nonoto-core = { path = "../nonoto-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
