services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    depends_on:
      - postgresql
    volumes:
      - .:/workspace
      - op-config:/home/developer/.config/op
      - wikino-cli-config:/home/developer/.config/wikino
    ports:
      - "4500:8080"
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      - BINDING=0.0.0.0
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  postgresql:
    image: postgres:18.6
    ports:
      - "4501:5432"
    volumes:
      - postgresql18-data:/var/lib/postgresql:delegated
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  op-config:
  postgresql18-data:
  wikino-cli-config:
