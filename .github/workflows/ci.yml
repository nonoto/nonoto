name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt・lint・test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rustのバージョンは、開発コンテナと同じくmise.tomlから読む。
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      # デスクトップアプリ (GPUI) のビルドに要るパッケージ。開発コンテナのDockerfile.devと揃える。
      - name: GPUIのビルドに要るパッケージを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libfontconfig-dev libfreetype-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make lint
      - run: make test

  build-core:
    name: コアのビルド (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
          - name: iOS
            os: macos-latest
            target: aarch64-apple-ios
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Android
            os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: ターゲットを足す
        shell: bash
        run: rustup target add --toolchain "$(mise current rust)" ${{ matrix.target }}
      # Cのコードを含む依存をビルドできるよう、ランナーに入っているNDKのコンパイラーとリンカーを使う。
      - name: AndroidのNDKを設定する
        if: matrix.name == 'Android'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build -p nonoto-core --target ${{ matrix.target }} --locked
