[package]
name = "nonoto-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dirs = "7.0.0"
getrandom = "0.4.3"
jiff.workspace = true
# ページの本文をCRDTで持つ文書 (`document`) に使う。
loro.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror.workspace = true
uuid = { version = "1.29.2", features = ["v7"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
keyring-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core.workspace = true
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
keyring-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
