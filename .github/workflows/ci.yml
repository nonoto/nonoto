name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt・lint・test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rustのバージョンは、開発コンテナと同じくmise.tomlから読む。
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      # デスクトップアプリ (GPUI) のビルドに要るパッケージ。開発コンテナのDockerfile.devと揃える。
      - name: GPUIのビルドに要るパッケージを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libfontconfig-dev libfreetype-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make lint
      - run: make test

  build-core:
    name: コアと計測のコードのビルド (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
          - name: iOS
            os: macos-latest
            target: aarch64-apple-ios
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Android
            os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: ターゲットを足す
        shell: bash
        run: rustup target add --toolchain "$(mise current rust)" ${{ matrix.target }}
      # Cのコードを含む依存をビルドできるよう、ランナーに入っているNDKのコンパイラーとリンカーを使う。
      - name: AndroidのNDKを設定する
        if: matrix.name == 'Android'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # make lint は開発環境のOS向けにだけ検査するため、OSごとに分けたコードと依存を持つコアは、各OS向けにも検査する。
      # WindowsではGit Bashのperlが同梱のOpenSSLの設定に使うモジュールを持たないため、既定のシェルで動かす。
      # シェルごとに引用符の扱いが変わらないよう、警告をエラーにする設定は環境変数で渡す。
      - name: コアをclippyで検査する
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy -p nonoto-core --all-targets --target ${{ matrix.target }} --locked
      - run: cargo build -p nonoto-core --target ${{ matrix.target }} --locked
      # 全文検索のトークナイザーをCのAPIで登録するコードも、各OS向けにビルドできることを確かめる。
      - run: cargo build -p store-comparison --target ${{ matrix.target }} --locked
      # CRDTのライブラリの比較のコードも、各OS向けにビルドできることを確かめる。
      - run: cargo build -p crdt-comparison --target ${{ matrix.target }} --locked
      # OpenSSLに依存しない暗号化の実装 (sqlite3mc) も、各OS向けにビルドできることを確かめる。
      # 設定 (.cargo/config.toml) を読ませるため、クレートのディレクトリでビルドする。
      - name: sqlite3mcのソースを取得する
        shell: bash
        run: scripts/fetch-sqlite3mc.sh
      - name: sqlite3mcにリンクする比較のコードをビルドする
        shell: bash
        working-directory: spikes/sqlite3mc-comparison
        run: cargo build --target ${{ matrix.target }} --locked
